[project]
name = "digital-twin"
version = "0.1.0"
description = "Personal Digital Twin agent for tracking pro/perso goals, built on the Claude Agent SDK."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "streamlit>=1.40",
    "claude-agent-sdk>=0.1.0",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digital_twin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
